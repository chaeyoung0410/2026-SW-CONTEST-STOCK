<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup</title>

    <link rel="stylesheet" href="../assets/css/Signup.css">
</head>

<body>

    <div class="signup_page">

        <!-- 왼쪽 캐릭터 영역 -->
        <div class="character_area">
            <div class="speech_bubble">
                <div class="speech_title">
                    <div>✦</div>
                    <div>반가워요!</div>
                    <div>✦</div>
                </div>
                <div class="speech_description">
                    자수정가에 오신 것을<br>
                    환영합니다!
                </div>
            </div>

            <img src="./assets/img/signup-character.png" alt="자수정가 캐릭터" class="signup_character">
        </div>


        <!-- 회원가입 카드 -->
        <div class="signup_card">
            <!-- 회원가입 상단 -->
            <div class="signup_header">
                <div class="logo_wrap">
                    <img src="./assets/img/logo-icon.png" alt="자수정가 로고" class="logo_icon">
                    <div class="logo_sparkle sparkle_left">✦</div>
                    <div class="logo_sparkle sparkle_right">✦</div>
                </div>
                <div class="signup_title">회원가입</div>
                <div class="signup_description">
                    자수정가와 함께 주식 공부를 시작해보아요!
                </div>
            </div>


            <!-- 입력 영역 -->
            <div class="signup_form">
                <!-- 아이디 -->
                <div class="input_group">
                    <div class="input_label">아이디</div>
                    <div class="input_box" id="userIdInputBox">
                        <div class="input_icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="8" r="4"></circle>
                                <path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>
                            </svg>
                        </div>
                        <input type="text" id="userId" name="user_id" placeholder="아이디를 입력해주세요" autocomplete="username">
                    </div>
                    <div id="userIdMessage" class="input_message"></div>
                </div>


                <!-- 비밀번호 -->
                <div class="input_group">
                    <div class="input_label">비밀번호</div>
                    <div class="input_box" id="passwordInputBox">
                        <div class="input_icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                            </svg>
                        </div>

                        <input type="password" id="password" name="password" placeholder="숫자 6자리를 입력해주세요"
                            inputmode="numeric" maxlength="6" autocomplete="new-password">
                        <div id="passwordToggle" class="password_toggle" role="button" tabindex="0"
                            aria-label="비밀번호 표시">

                            <img id="passwordEye" src="../assets/img/eye_closed.svg" alt="비밀번호 표시">
                        </div>
                    </div>

                    <div id="passwordError" class="error_message"></div>
                </div>


                <!-- 비밀번호 확인 -->
                <div class="input_group">
                    <div class="input_label">비밀번호 확인</div>

                    <div class="input_box" id="passwordConfirmInputBox">

                        <!-- 왼쪽 자물쇠 아이콘 -->
                        <div class="input_icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                            </svg>
                        </div>

                        <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호를 다시 입력해주세요"
                            inputmode="numeric" maxlength="6" autocomplete="new-password">

                        <!-- 오른쪽 눈 아이콘 -->
                        <div id="passwordConfirmToggle" class="password_toggle" role="button" tabindex="0"
                            aria-label="비밀번호 확인 표시">
                            <img id="passwordConfirmEye" src="../assets/img/eye_closed.svg" alt="비밀번호 확인 표시">
                        </div>

                    </div>

                    <div id="passwordConfirmError" class="error_message"></div>
                </div>


                <!-- 하단 버튼 -->
                <div class="button_area">
                    <div id="loginBackButton" class="login_back_button" role="button" tabindex="0">
                        <div>로그인으로 돌아가기</div>
                        <div>←</div>
                    </div>

                    <div id="signupButton" class="signup_button" role="button" tabindex="0">
                        <div>가입하기</div>
                        <div>→</div>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="../assets/js/Signup.js"></script>

</body>

</html>
