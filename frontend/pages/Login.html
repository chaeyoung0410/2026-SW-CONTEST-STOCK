<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="../assets/css/Login.css">
    <link rel="stylesheet" href="../assets/css/motion.css">
    <script src="../assets/js/motion.js" defer></script>
</head>

<body>

    <div class="login_wrap">
        <!-- 왼쪽 캐릭터 영역 -->
        <div class="character_area">
            <img src="../assets/img/player.png" alt="자수정가 캐릭터" class="login_character">
        </div>


        <!-- 로그인 카드 -->
        <div class="login_card">

            <!-- 로그인 상단 -->
            <div class="login_header">
                <div class="logo_wrap">
                    <img src="../assets/img/login_logo.png" alt="자수정가 로고" class="logo_icon">
                </div>
                <div class="login_title">로그인</div>
                <div class="login_description">
                    자수정가 계정으로 로그인하고<br>
                    나의 학습 여정을 이어가세요!
                </div>
            </div>


            <!-- 로그인 입력 영역 -->
            <div id="loginForm" class="login_form">
                <!-- 아이디 -->
                <div class="input_group">
                    <div class="input_label">아이디</div>
                    <div class="input_box">
                        <img src="../assets/img/id_icon.png" alt="" class="input_icon">

                        <input type="text" id="userId" name="userId" placeholder=" 입력해주세요" autocomplete="username">
                    </div>
                </div>


                <!-- 비밀번호 -->
                <div class="input_group">
                    <div class="input_label">비밀번호</div>
                    <div class="input_box" id="passwordInputBox">
                        <img src="../assets/img/pw_icon.png" alt="" class="input_icon">


                        <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요"
                            autocomplete="current-password">

                        <div id="passwordToggle" class="password_toggle" role="button" tabindex="0"
                            aria-label="비밀번호 표시">
                            <img id="passwordEye" src="../assets/img/eye_closed.svg" alt="비밀번호 표시">
                        </div>
                    </div>

                    <div id="loginError" class="error_message">
                        아이디 또는 비밀번호가 올바르지 않습니다.
                    </div>
                </div>


                <!-- 로그인 버튼 -->
                <div id="loginButton" class="login_button" role="button" tabindex="0">
                    <div>로그인</div>
                    <div>→</div>
                </div>


                <!-- 구분선 -->
                <div class="divider">
                    <div class="divider_line"></div>
                    <div class="divider_text">또는</div>
                    <div class="divider_line"></div>
                </div>


                <!-- 회원가입 버튼 -->
                <div id="signupButton" class="signup_button" role="button" tabindex="0">
                    <div>회원가입</div>
                    <div>→</div>
                </div>

            </div>

        </div>

    </div>

    <script src="../assets/js/Login.js"></script>
</body>

</html>
