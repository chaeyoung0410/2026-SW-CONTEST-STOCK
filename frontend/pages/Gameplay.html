<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameplay</title>
    <link rel="stylesheet" href="../assets/css/Gameplay.css">
</head>

<body>

    <div class="Gameplay_wrap">

        <div class="gameplay_nav"></div>

        <!-- 스테이지 -->
        <div class="gameplay_stages">
            <img src="../assets/img/player.png" alt="플레이어" id="playerCharacter" class="player_character">

            <div class="gameplay_stage stage1" data-stage="1">1</div>
            <div class="gameplay_stage stage2" data-stage="2">2</div>
            <div class="gameplay_stage stage3" data-stage="3">3</div>
            <div class="gameplay_stage stage4" data-stage="4">4</div>
            <div class="gameplay_stage stage5" data-stage="5">5</div>
            <div class="gameplay_stage stage6" data-stage="6">6</div>
            <div class="gameplay_stage stage7" data-stage="7">7</div>
            <div class="gameplay_stage stage8" data-stage="8">8</div>
            <div class="gameplay_stage stage9" data-stage="9">9</div>
            <div class="gameplay_stage stage10" data-stage="10">10</div>
            <div class="gameplay_stage stage11" data-stage="11">11</div>
            <div class="gameplay_stage stage12" data-stage="12">12</div>
            <div class="gameplay_stage stage13" data-stage="13">13</div>
            <div class="gameplay_stage stage14" data-stage="14">14</div>
        </div>

        <!-- 나의 건물 -->
        <div class="gameplay_building">
            <p id="buildingLevel">Lv. 0</p>
            <p class="level_2">단계를 클리어 할 수록<br />건물이 발전해요!</p>
            <img src="../assets/img/building_1.png" id="myBuilding" class="building_img">
            <p>건물 성장도</p>
            <div class="next_level_box"></div>
        </div>

        <!-- 퀴즈 팝업 -->
        <div class="quiz_popup" id="quizPopup">

            <div class="quiz_container">

                <!-- 공통 헤더 -->
                <div class="quiz_header">
                    <div class="quiz_progress_bg">
                        <div class="quiz_progress_bar" id="progressBar"></div>
                    </div>
                </div>

                <!-- 문제 화면 -->
                <div class="quiz_page" id="quizPage">
                    <div class="quiz_character">
                        <img src="../assets/img/quiz_character.png" alt="캐릭터">
                    </div>
                    <div class="quiz_content">

                        <div class="quiz_question" id="quizQuestion">
                            문제 내용이 들어갑니다.
                        </div>
                        <div class="quiz_options">
                            <button class="quiz_option" id="option1"></button>
                            <button class="quiz_option" id="option2"></button>
                            <button class="quiz_option" id="option3"></button>
                            <button class="quiz_option" id="option4"></button>
                        </div>
                    </div>
                </div>

                <!-- 정답 화면 -->
                <div class="correct_page" id="correctPage">
                    <div class="result_character">
                    </div>
                    <h2 class="result_title">
                        정답!
                    </h2>
                    <p class="result_text" id="correctText">
                        정답이에요!
                    </p>
                    <button class="result_btn" id="nextQuestionBtn">
                        다음 문제
                    </button>
                </div>

                <!-- 오답 화면 -->
                <div class="wrong_page" id="wrongPage">
                    <div class="result_character">
                    </div>
                    <h2 class="wrong_title">
                        아쉽게도 오답이에요!
                    </h2>
                    <div class="correct_answer">
                        정답은
                        <span id="correctAnswer"></span>
                        입니다.
                    </div>
                    <button class="wrong_btn" id="conceptBtn">
                        개념 설명 보기
                    </button>
                </div>

                <!-- 개념 설명 화면 -->
                <div class="concept_page" id="conceptPage">
                    <div class="concept_character">
                    </div>
                    <h2 class="concept_title">개념 설명</h2>
                    <div class="concept_box">
                        <h3 id="conceptName">주식</h3>
                        <p id="conceptDescription">
                            주식은 회사의 소유권을 나타내는 증권입니다.
                        </p>
                    </div>
                    <!-- 개념 설명 화면 -->
                    <div class="concept_page" id="conceptPage">
                        <div class="concept_character"></div>

                        <h2 class="concept_title">개념 설명</h2>

                        <div class="concept_box">
                            <h3 id="conceptName">주식</h3>
                            <p id="conceptDescription">주식은 회사의 소유권을 나타내는 증권입니다.</p>
                        </div>

                        <!-- 다시 도전 선택 영역 -->
                        <div class="retry_box">
                            <div class="retry_ribbon">다시 도전할까요?</div>
                            <p class="retry_description">이번 문제를 다시 풀어보거나<br>다음 단계로 넘어갈 수 있어요.</p>
                            <div class="retry_buttons">
                                <button type="button" class="retry_btn" id="retryStageBtn">
                                    <span class="retry_icon">↻</span>
                                    <span>다시 풀기</span>
                                </button>

                                <button type="button" class="next_stage_btn" id="nextStageBtn">
                                    <span class="next_icon">➜</span>
                                    <span>다음 단계로</span>
                                </button>
                            </div>
                        </div>

                        <div class="concept_tip">
                            <span class="tip_icon">💡</span>
                            <div class="tip_content">
                                <strong>TIP</strong>
                                <p>처음 틀려도 괜찮아요!<br>많이 풀수록 더 많이 배울 수 있어요.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="gameplay_footer"></div>

    </div>

    <script src="../js/Gameplay.js"></script>

</body>

</html>
