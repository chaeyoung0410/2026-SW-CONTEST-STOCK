<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 맞춤 학습 추천</title>
<link rel="stylesheet" href="../assets/css/ai.css" />
<link rel="stylesheet" href="../assets/css/motion.css" />
<script src="../assets/js/motion.js" defer></script>
</head>
<body>

  <div class="app-frame">

    <!-- 뒤로가기 버튼 -->
    <button class="icon-btn back-btn" type="button" aria-label="뒤로가기">
      <img src="../assets/img/back.png" alt="" />
    </button>
    
    <!--  오늘의 추천 (상단 카드)  -->
    <section class="today-card">
      <!--
        예) todayCard.querySelector('.card-content').innerHTML = ... 로 렌더링
      -->
      <div class="card-content" data-slot="today-recommendation"></div>

      <button class="btn btn-primary" type="button" data-action="start-today">
        학습 시작
      </button>
    </section>


    <!-- 추천 학습 콘텐츠 (리스트 카드)  -->
    <section class="list-card">

      <div class="list-row">
        <div class="card-content" data-slot="recommend-item-1"></div>
        <button class="btn btn-secondary" type="button" data-action="start-item" data-item="1">
          학습하기
        </button>
      </div>

      <div class="list-row">
        <div class="card-content" data-slot="recommend-item-2"></div>
        <button class="btn btn-secondary" type="button" data-action="start-item" data-item="2">
          학습하기
        </button>
      </div>

      <div class="list-row">
        <div class="card-content" data-slot="recommend-item-3"></div>
        <button class="btn btn-secondary" type="button" data-action="start-item" data-item="3">
          학습하기
        </button>
      </div>

    </section>


    <!-- 하단 네비게이션 바 -->
<footer class="bottom-nav">

  <button class="nav-item" type="button" data-nav="home">
    <img src="../assets/img/home.png" alt="홈" />
    <span>홈</span>
  </button>

  <button class="nav-item nav-item--active" type="button" data-nav="ai-recommend">
    <img src="../assets/img/ai_icon.png" alt="AI 추천 학습" />
    <span>AI 추천 학습</span>
  </button>

  <button class="nav-item" type="button" data-nav="mypage">
    <img src="../assets/img/person.png" alt="마이페이지" />
    <span>마이페이지</span>
  </button>

</footer>
  </div>
 
  <script src="../assets/js/ai.js"></script> 
</body>
</html>
